version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    
    # This prevents Dependabot from suggesting version 7.x
    ignore:
      - dependency-name: "prisma"
        versions: [">= 7.0.0"]
      - dependency-name: "@prisma/client"
        versions: [">= 7.0.0"]

    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
      react:
        patterns:
          - "react"
          - "react-dom"
